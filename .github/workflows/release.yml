name: Release

# 仅准备和上传产物，不创建标签、GitHub Release 或执行公证。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notchx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'oevery/notchx'
    runs-on: macos-26
    timeout-minutes: 45
    environment: release-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Show SDK and compiler
        run: xcodebuild -version && xcrun --sdk macosx --show-sdk-version && swift --version
      - name: Read the single version configuration
        id: metadata
        run: |
          python3 scripts/release.py metadata > "$RUNNER_TEMP/notchx-metadata.json"
          jq -r '"artifact=" + .artifact' "$RUNNER_TEMP/notchx-metadata.json" >> "$GITHUB_OUTPUT"
      - name: Check project, localization and metadata without signing credentials
        run: bash scripts/test.sh --checks-only
      - name: Identify compiler cache environment
        id: compiler
        run: |
          toolchain_key=$({ sw_vers -buildVersion; xcodebuild -version; xcrun --sdk macosx --show-sdk-build-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"
      - name: Restore and save compiler intermediates only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # No Build/Products, signed application, release archives, or signing directory.
          path: |
            build/DerivedData/ModuleCache.noindex
            build/DerivedData/SDKStatCaches.noindex
            build/DerivedData/Build/Intermediates.noindex
          key: notchx-compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-release-universal-${{ hashFiles('App/**', 'Helpers/**', 'Config/*.xcconfig', 'NotchX.xcodeproj/project.pbxproj', 'scripts/build-native-components.sh') }}
          restore-keys: |
            notchx-compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-release-universal-
      - name: Probe fixed signing identity, build and verify the extracted archive
        env:
          NOTCHX_SIGNING_P12_BASE64: ${{ secrets.NOTCHX_SIGNING_P12_BASE64 }}
          NOTCHX_SIGNING_P12_PASSWORD: ${{ secrets.NOTCHX_SIGNING_P12_PASSWORD }}
        run: python3 scripts/release.py build
      - name: Save verified self-signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          path: |
            build/release/${{ steps.metadata.outputs.artifact }}.zip
            build/release/${{ steps.metadata.outputs.artifact }}.zip.sha256
            build/release/${{ steps.metadata.outputs.artifact }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Summarize distribution limits
        run: |
          {
            echo '### NotchX Release preparation'
            echo '固定自签，未经 Apple 公证；不是 Developer ID 分发包。'
            echo '本次仅上传产物，不创建标签或 GitHub Release。'
            echo 'CI 不运行 XCTest；发布前对相同提交完成核心测试，并分别确认所需 UI 回归与人工验收。'
            echo 'Gatekeeper 放行与权限升级保留仍需用户验收。'
          } >> "$GITHUB_STEP_SUMMARY"
