name: Release

# 发布时上传到已有 Release；手动入口仅验证，不创建 Release/tag 或执行公证。
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: notchx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'oevery/notchx' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.context.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate event, version, tag and main ancestry without signing secrets
        id: context
        run: |
          python3 scripts/release.py ci-context > "$RUNNER_TEMP/notchx-context.json"
          jq -r '"commit=" + .commit' "$RUNNER_TEMP/notchx-context.json" >> "$GITHUB_OUTPUT"
  release:
    needs: preflight
    name: Package ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-26
    timeout-minutes: 45
    environment: release-signing
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Set up repository-pinned tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          mise_dir: ${{ runner.temp }}/notchx-tools
      - name: Show SDK and compiler
        run: xcodebuild -version && xcrun --sdk macosx --show-sdk-version && swift --version
      - name: Read the single version configuration
        id: metadata
        run: |
          python3 scripts/release.py metadata --arch ${{ matrix.arch }} > "$RUNNER_TEMP/notchx-metadata.json"
          jq -r '"artifact=" + .artifact' "$RUNNER_TEMP/notchx-metadata.json" >> "$GITHUB_OUTPUT"
      - name: Check project, localization and metadata without signing credentials
        run: mise run check
      - name: Identify compiler cache environment
        id: compiler
        run: |
          toolchain_key=$({ sw_vers -buildVersion; xcodebuild -version; xcrun --sdk macosx --show-sdk-build-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"
      - name: Restore and save compiler intermediates only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # No Build/Products, signed application, release archives, or signing directory.
          path: |
            build/DerivedData-${{ matrix.arch }}/ModuleCache.noindex
            build/DerivedData-${{ matrix.arch }}/SDKStatCaches.noindex
            build/DerivedData-${{ matrix.arch }}/Build/Intermediates.noindex
          key: notchx-compiler-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-release-${{ matrix.arch }}-${{ hashFiles('App/**', 'Helpers/**', 'Config/*.xcconfig', 'NotchX.xcodeproj/project.pbxproj', 'scripts/build-native-components.sh', 'scripts/release.py') }}
          restore-keys: |
            notchx-compiler-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-release-${{ matrix.arch }}-
      - name: Probe fixed signing identity, build and verify the mounted DMG
        env:
          NOTCHX_SIGNING_P12_BASE64: ${{ secrets.NOTCHX_SIGNING_P12_BASE64 }}
          NOTCHX_SIGNING_P12_PASSWORD: ${{ secrets.NOTCHX_SIGNING_P12_PASSWORD }}
        run: mise run build -- --arch ${{ matrix.arch }}
      - name: Downloadable DMG without ZIP wrapper
        id: dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/release/${{ steps.metadata.outputs.artifact }}.dmg
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Save verification metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.artifact }}-verification
          path: |
            build/release/${{ steps.metadata.outputs.artifact }}.dmg.sha256
            build/release/${{ steps.metadata.outputs.artifact }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Summarize distribution limits
        env:
          DMG_URL: ${{ steps.dmg.outputs.artifact-url }}
          ARTIFACT: ${{ steps.metadata.outputs.artifact }}
        run: |
          {
            echo '### NotchX Release preparation'
            echo "下载：[$ARTIFACT.dmg]($DMG_URL)"
            echo '固定自签，未经 Apple 公证；不是 Developer ID 分发包。'
            echo '手动运行仅保存 CI 产物；发布事件在双架构均通过后上传到已有 Release。'
            echo 'CI 不运行 XCTest；发布前对相同提交完成核心测试，并分别确认所需 UI 回归与人工验收。'
            echo 'Gatekeeper 放行与权限升级保留仍需用户验收。'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Attach verified assets to published Release
    needs: [preflight, release]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          mise_dir: ${{ runner.temp }}/notchx-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: NotchX-*
          path: build/release
          merge-multiple: true
      - name: Reverify both DMGs and attach without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          NOTCHX_EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: mise exec -- python3 scripts/release.py publish-assets
